# ============================================================================
# U EPMS - Factory Management System
# Dedicated Apache site on port 3000 (replaces `php -S 127.0.0.1:3000`)
# Included from httpd.conf. Mirrors the behavior of the project's router.php:
#   - "/" serves the login page (or dashboard/procurement when signed in)
#   - extensionless URLs like /dashboard map to /dashboard.php
#   - sensitive files (.env, database.sql, includes/, tests/) are blocked
# ============================================================================

Listen 3000

<VirtualHost *:3000>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs/U EPMS"

    <Directory "C:/xampp/htdocs/U EPMS">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require local

        DirectoryIndex index.php
        RewriteEngine On

        # Extensionless URLs -> .php (e.g. /dashboard -> /dashboard.php)
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME}.php -f
        RewriteRule ^(.+)$ $1.php [L]
    </Directory>

    # ---- Protect sensitive project files ----

    # Dotfiles (.env, .env.example, .gitignore, ...)
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Raw SQL dump, helper classes, test scripts, docs
    RedirectMatch 403 ^/database\.sql$
    RedirectMatch 403 ^/includes/
    RedirectMatch 403 ^/data/
    RedirectMatch 403 ^/tests/
    RedirectMatch 403 ^/init_db\.php$
    RedirectMatch 403 ^/README\.md$

    ErrorLog  "C:/xampp/apache/logs/uepms-error.log"
    CustomLog "C:/xampp/apache/logs/uepms-access.log" combined
</VirtualHost>
